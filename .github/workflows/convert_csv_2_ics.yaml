# This is a basic workflow to help you get started with Actions

name: CSV2ICS

# Controls when the workflow will run
on:
  #schedule:
    # Runs "at minute 55 past every hour" (see https://crontab.guru)
    #- cron: '40 6 * * *'
  # Triggers the workflow on push or pull request events but only for the "main" branch
  #push:
   # branches: [ "main" ]
  #pull_request:
   # branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:    
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
    
env:
  SSH: false
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TZ: Asia/Hong_Kong
##on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
 ## push:
   ## branches: [ "main" ]
  ##pull_request:
    ##branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  ##workflow_dispatch:


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Runs a single command using the runners shell
      #- name: Run a one-line script
       # run: echo Hello, world!

      - name: Space cleanup
        env:
          SSH_ACTIONS: false
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi `docker images -q`
          apt list --installed
          pip3 install altgraph easygui icalendar macholib modulegraph py2app python-dateutil pytz six 
          sudo timedatectl set-timezone "$TZ"
          #git clone https://github.com/ntop/n2n
          #cd n2n
          #./autogen.sh
          #./configure
          #make -j2
          #sudo make install
          #sudo sysctl -w net.ipv4.ip_forward=1
          #edge -f -u 0 -g 0 -d edge -a static:10.1.1.150/ -c myhome -l ddns.org -k password &
          #sudo apt-get install shadowsocks-libev
          #vi /etc/shadowsocks-libev/config.json
      
     
      - name: 啟動 Upterm 免卡免帳號 SSH 通道
        # 使用 owenthereal/action-upterm 作為最新維護版本替代
        uses: owenthereal/action-upterm@v1
        if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
        with:
          limit-access-to-actor: true

      - name: 擷取連線資訊並發送到 Telegram
        if: always() && (github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh'))
        run: |
          # 等待 Upterm 隧道準備就緒並生成連線指令
          sleep 5
          
          # 從系統日誌中抓取 SSH 連線指令
          SSH_CMD=$(upterm session current --format ssh-url 2>/dev/null || echo "正在生成連線資訊，請稍後刷新 GitHub 日誌...")
          
          # 組裝發送給 Telegram 的訊息內容
          MSG="🚀 *GitHub Actions 偵錯連線已啟動* %0A%0A 📋 *連線指令：* %0A \`$SSH_CMD\`"
          
          # 使用 curl 呼叫 Telegram Bot API 發送訊息
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=MarkdownV2" \
            -d "text=$MSG"
        env:
          TELEGRAM_BOT_TOKEN: '5352319218:AAGkspTTlIjIRyfYlI7Egz4NciZ78bT3NF4'
          TELEGRAM_CHAT_ID: 1373335316



      
      
      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          #echo pwd
          ##/home/runner/work/roster/roster/icsconverter.py google_cal_08311.csv
          /home/runner/work/roster/roster/csv2ical.py google_cal_08311.csv 8311.ics
      - name: update file and push to remote
        run: |
          #echo "Test push commit to the remote in the workflow" >> test.txt
          git config --global user.name "harrylwc1"
          git config --global user.email "harrylwc1@gmail.com"
          #git remote set-url --push origin https://harrylwc1@gmail.com:$GITHUB_TOKEN@github.com/harrylwc/roster
          git commit -m "Add changes" -a
          git push https://github.com/harrylwc1/roster    
 
          
      -  name: SSH connection for failure Debug
         if: ${{ failure() }}
         uses: lhotari/action-upterm@v1
