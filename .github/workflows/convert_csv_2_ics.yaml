name: CSV2ICS

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  TZ: Asia/Hong_Kong
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: System preparation
        id: prepare
        run: |
          # 清理 Docker（如有）
          docker system prune -f || true
          
          # 安装 Python 包
          pip3 install --upgrade pip
          pip3 install altgraph easygui icalendar macholib modulegraph py2app python-dateutil pytz six
          
          sudo timedatectl set-timezone "$TZ"

      - name: Convert CSV to iCal
        id: convert
        run: |
          python3 csv2ical.py google_cal_08311.csv 8311.ics
          echo "✅ Conversion completed"

      - name: Git commit changes
        id: commit
        run: |
          git config --global user.name "harrylwc1"
          git config --global user.email "harrylwc1@gmail.com"
          git add 8311.ics
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update calendar: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Git push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Setup SSH Debug Session
        if: ${{ github.event.inputs.ssh == 'true' }}
        uses: P3TERX/ssh2actions@main
        env:
           TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
           TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
