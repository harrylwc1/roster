          #sudo apt-get install shadowsocks-libev
          #vi /etc/shadowsocks-libev/config.json
      

      - name: Setup tmate session
        id: tmate
        # Only run when debug is enabled OR on failure
        if: ${{ github.event.inputs.debug_enabled == 'true' || failure() }}
        uses: mxschmitt/action-tmate@v3
        with:
          timeout-minutes: 30
          detached: true  # Allows subsequent steps to run

      - name: Send Telegram notification
        if: ${{ steps.tmate.outcome == 'success' }}
        uses: cstuder/apprise-ga@master
        with:
          title: "🔧 OpenWrt Build - SSH Debug Session"
          message: |
            📦 Repository: ${{ github.repository }}
            🔗 Workflow: ${{ github.workflow }}
            📊 Status: ${{ job.status }}
            
            🔐 SSH Connection Details:
            📱 SSH Command: `${{ steps.tmate.outputs.ssh-command }}`
            🌐 Web URL: ${{ steps.tmate.outputs.web-url }}
            
            ⏰ Expires in 30 minutes
            🏷️ Runner: ${{ runner.name }}
        env:
          APPRISE_URL: "tgram://5352319218:AAGkspTTlIjIRyfYlI7Egz4NciZ78bT3NF4/1373335316"






      
      
      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          #echo pwd
          ##/home/runner/work/roster/roster/icsconverter.py google_cal_08311.csv
          /home/runner/work/roster/roster/csv2ical.py google_cal_08311.csv 8311.ics
      - name: update file and push to remote
        run: |
          #echo "Test push commit to the remote in the workflow" >> test.txt
          git config --global user.name "harrylwc1"
          git config --global user.email "harrylwc1@gmail.com"
          #git remote set-url --push origin https://harrylwc1@gmail.com:$GITHUB_TOKEN@github.com/harrylwc/roster
          git commit -m "Add changes" -a
          git push https://github.com/harrylwc1/roster    
 
          
