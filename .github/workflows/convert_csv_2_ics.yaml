name: CSV2ICS

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '啟動 SSH 除錯模式？(輸入 true 啟動)'
        required: false
        default: 'false'

env:
  TZ: Asia/Hong_Kong
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---------- 基本環境準備 ----------
      - name: System preparation
        run: |
          pip3 install --upgrade pip
          pip3 install icalendar python-dateutil pytz six
          sudo timedatectl set-timezone "$TZ"

      # ---------- CSV 轉 iCal ----------
      - name: Convert CSV to iCal
        run: |
          if [ ! -f csv2ical.py ]; then
            echo "❌ csv2ical.py 唔存在，請檢查倉庫！"
            exit 1
          fi
          python3 csv2ical.py google_cal_08311.csv 8311.ics
          echo "✅ 轉換完成"

      # ---------- Git 提交（如有變更） ----------
      - name: Git commit changes
        id: commit
        run: |
          git config --global user.name "harrylwc1"
          git config --global user.email "harrylwc1@gmail.com"
          git add 8311.ics
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update calendar: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Git push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          G_HOST="github.com"
          G_REPO="${{ github.repository }}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${G_HOST}/${G_REPO}.git"

      # ✅  使 用  upterm 
      - name: SSH connection for debug
        id: upterm
        if: failure() || github.event.inputs.ssh == 'true'
        uses: lhotari/action-upterm@v1
  
