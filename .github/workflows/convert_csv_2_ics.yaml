name: CSV2ICS

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  TZ: Asia/Hong_Kong
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: System preparation
        id: prepare
        run: |
          # 清理 Docker（如有）
          docker system prune -f || true
          
          # 安装 Python 包
          pip3 install --upgrade pip
          pip3 install altgraph easygui icalendar macholib modulegraph py2app python-dateutil pytz six
          
          sudo timedatectl set-timezone "$TZ"

      - name: Convert CSV to iCal
        id: convert
        run: |
          python3 csv2ical.py google_cal_08311.csv 8311.ics
          echo "✅ Conversion completed"

      - name: Git commit changes
        id: commit
        run: |
          git config --global user.name "harrylwc1"
          git config --global user.email "harrylwc1@gmail.com"
          git add 8311.ics
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update calendar: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Git push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

       # ✅ 使用 tmate（支持 detached，不会卡住）
      - name: Setup tmate session
        if: ${{ github.event.inputs.ssh == 'true' }}
        uses: owenthereal/action-upterm@v1
        with:
          detached: true 
          #uses: mxschmitt/action-tmate@v3
        #with:
         # timeout-minutes: 15  # 加上超时时间防止无限挂起
         # detached: true  # ✅ 后台运行，不阻塞 workflow

      # ✅ 发送 Telegram 通知（正确引用 tmate 输出）
      - name: Send Telegram notification
        if: always() && steps.tmate.outcome == 'success'
        uses: cstuder/apprise-ga@master
        with:
          title: ${{ steps.convert.outcome == 'success' && '✅ 转换成功 - SSH 调试可用' || '❌ 转换失败 - SSH 调试可用' }}
          message: |
            📅 CSV to iCal 通知
            -------------------------
            📦 仓库: ${{ github.repository }}
            🌿 分支: ${{ github.ref_name }}
            📊 转换状态: ${{ steps.convert.outcome }}
            🖥️ Runner: ${{ runner.name }}
            
            🔐 SSH 连接已开启（tmate，后台运行）
            📱 SSH 命令: `${{ steps.tmate.outputs.ssh-command }}`
            🌐 Web 链接: ${{ steps.tmate.outputs.web-url }}
            
            ⏰ 会话将在 30 分钟后自动关闭
            💡 连接后输入 'exit' 关闭会话
        env:
          APPRISE_URL: "tgram://${{ secrets.TELEGRAM_BOT_TOKEN }}/${{ secrets.TELEGRAM_CHAT_ID }}"
