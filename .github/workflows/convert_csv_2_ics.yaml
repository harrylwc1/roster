# This is a basic workflow to help you get started with Actions

name: CSV2ICS

# Controls when the workflow will run
on:
  #schedule:
    # Runs "at minute 55 past every hour" (see https://crontab.guru)
    #- cron: '40 6 * * *'
  # Triggers the workflow on push or pull request events but only for the "main" branch
  #push:
   # branches: [ "main" ]
  #pull_request:
   # branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:    
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
    
env:
  SSH: false
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TZ: Asia/Hong_Kong
##on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
 ## push:
   ## branches: [ "main" ]
  ##pull_request:
    ##branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  ##workflow_dispatch:


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Runs a single command using the runners shell
      #- name: Run a one-line script
       # run: echo Hello, world!

      - name: Space cleanup
        env:
          SSH_ACTIONS: false
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi `docker images -q`
          apt list --installed
          pip3 install altgraph easygui icalendar macholib modulegraph py2app python-dateutil pytz six 
          sudo timedatectl set-timezone "$TZ"
          #git clone https://github.com/ntop/n2n
          #cd n2n
          #./autogen.sh
          #./configure
          #make -j2
          #sudo make install
          #sudo sysctl -w net.ipv4.ip_forward=1
          #edge -f -u 0 -g 0 -d edge -a static:10.1.1.150/ -c myhome -l ddns.org -k password &
          #sudo apt-get install shadowsocks-libev
          #vi /etc/shadowsocks-libev/config.json
      
      - name: 1. 在背景啟動 Upterm SSH 通道
        id: upterm_ssh
        uses: owenthereal/action-upterm@v1
        if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
        with:
          # 👈 修正為正確的參數名稱，讓通道在背景非同步啟動
          detached: true

      - name: 2. 擷取日誌連線資訊並發送 Telegram，然後卡住等待
        if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
        run: |
          # 1. 緩衝 8 秒，給背景的 Upterm 足夠的時間完成伺服器握手與日誌寫入
          sleep 8
          
          # 2. 自動為觸發者（你本人）授權 GitHub 帳號裡的 SSH Key 登入憑證
          mkdir -p ~/.ssh
          curl -s https://github.com{{ github.actor }}.keys >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          
          # 3. 核心：從 Upterm 產生的系統日誌中，用正規表示式抓取唯一的 SSH 連線網址
          SSH_CMD=$(grep -oE "ssh://[^ ]+" /home/runner/.upterm.log | head -n 1 || echo "")
          
          if [ -z "$SSH_CMD" ]; then
            # 備用抓取嘗試：檢查當前使用者目錄
            SSH_CMD=$(grep -oE "ssh://[^ ]+" ~/.upterm.log | head -n 1 || echo "")
          fi
          
          if [ -z "$SSH_CMD" ]; then
            SSH_CMD="未能從日誌中即時擷取到網址，請至 GitHub Actions 的 Live Log 內手動查看。"
          fi
          
          # 4. 組裝推送到 Telegram 的訊息
          MSG="🚀 *GitHub Actions 偵錯連線已啟動* %0A%0A 📋 *連線指令：* %0A \`$SSH_CMD\`"
          
          # 5. 秒發送到 Telegram
          curl -s -X POST "https://telegram.org{{ env.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=MarkdownV2" \
            -d "text=$MSG"
            
          echo "============================================="
          echo "Telegram 通知已發送！抓取到的指令為: $SSH_CMD"
          echo "當你偵錯完畢想讓 Workflow 繼續往下跑時，請在連線的終端機執行："
          echo "touch continue"
          echo "============================================="
          
          # 6. 在這個步驟真正卡住 Runner，開始等你的 SSH 連線
          while [ ! -f continue ]; do
            sleep 10
          done
          echo "偵錯完成，工作流繼續執行後續步驟。"
        env:
          TELEGRAM_BOT_TOKEN: '5352319218:AAGkspTTlIjIRyfYlI7Egz4NciZ78bT3NF4'
          TELEGRAM_CHAT_ID: 1373335316





      
      
      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          #echo pwd
          ##/home/runner/work/roster/roster/icsconverter.py google_cal_08311.csv
          /home/runner/work/roster/roster/csv2ical.py google_cal_08311.csv 8311.ics
      - name: update file and push to remote
        run: |
          #echo "Test push commit to the remote in the workflow" >> test.txt
          git config --global user.name "harrylwc1"
          git config --global user.email "harrylwc1@gmail.com"
          #git remote set-url --push origin https://harrylwc1@gmail.com:$GITHUB_TOKEN@github.com/harrylwc/roster
          git commit -m "Add changes" -a
          git push https://github.com/harrylwc1/roster    
 
          
      -  name: SSH connection for failure Debug
         if: ${{ failure() }}
         uses: lhotari/action-upterm@v1
