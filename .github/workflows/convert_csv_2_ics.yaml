name: CSV2ICS

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  TZ: Asia/Hong_Kong
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: System preparation
        id: prepare
        run: |
          # Clean Docker (safe way)
          docker system prune -f || true
          
          # List installed packages (limited)
          apt list --installed 2>/dev/null | head -20 || true
          
          # Install Python packages
          pip3 install --upgrade pip
          pip3 install altgraph easygui icalendar macholib modulegraph py2app python-dateutil pytz six
          
          # Set timezone
          sudo timedatectl set-timezone "$TZ"

      - name: Convert CSV to iCal
        id: convert
        run: |
          python3 /home/runner/work/roster/roster/csv2ical.py google_cal_08311.csv 8311.ics
          echo "✅ Conversion completed"

      - name: Git commit changes
        id: commit
        run: |
          git config --global user.name "harrylwc1"
          git config --global user.email "harrylwc1@gmail.com"
          git add 8311.ics
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update calendar: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Git push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      # 只在失败时启动 tmate（调试用）
      - name: Setup tmate session (on failure)
        id: tmate
        if: failure() || github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          timeout-minutes: 30
          detached: true

      # 发送 Telegram 通知
      - name: Send Telegram notification
        if: always() && steps.tmate.outcome == 'success'
        uses: cstuder/apprise-ga@master
        with:
          title: ${{ steps.convert.outcome == 'success' && '✅ Conversion Success - SSH Debug' || '❌ Conversion Failed - SSH Debug Available' }}
          message: |
            📅 CSV to iCal Notification
            -------------------------
            📦 Repository: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            📊 Status: ${{ steps.convert.outcome }}
            🖥️ Runner: ${{ runner.name }}
            
            🔐 SSH Connection Details:
            📱 Command: `${{ steps.tmate.outputs.ssh-command }}`
            🌐 Web: ${{ steps.tmate.outputs.web-url }}
            
            ⏰ Session expires in 30 minutes
            💡 Type 'exit' to close the session
        env:
          APPRISE_URL: "tgram://${{ secrets.TELEGRAM_BOT_TOKEN }}/${{ secrets.TELEGRAM_CHAT_ID }}"
