# This is a basic workflow to help you get started with Actions

name: CSV2ICS

# Controls when the workflow will run
on:
  #schedule:
    # Runs "at minute 55 past every hour" (see https://crontab.guru)
    #- cron: '40 6 * * *'
  # Triggers the workflow on push or pull request events but only for the "main" branch
  #push:
   # branches: [ "main" ]
  #pull_request:
   # branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:    
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
    
env:
  SSH: false
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TZ: Asia/Hong_Kong
##on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
 ## push:
   ## branches: [ "main" ]
  ##pull_request:
    ##branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  ##workflow_dispatch:


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Runs a single command using the runners shell
      #- name: Run a one-line script
       # run: echo Hello, world!

      - name: Space cleanup
        env:
          SSH_ACTIONS: false
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi `docker images -q`
          apt list --installed
          pip3 install altgraph easygui icalendar macholib modulegraph py2app python-dateutil pytz six 
          sudo timedatectl set-timezone "$TZ"
          #git clone https://github.com/ntop/n2n
          #cd n2n
          #./autogen.sh
          #./configure
          #make -j2
          #sudo make install
          #sudo sysctl -w net.ipv4.ip_forward=1
          #edge -f -u 0 -g 0 -d edge -a static:10.1.1.150/ -c myhome -l ddns.org -k password &
          #sudo apt-get install shadowsocks-libev
          #vi /etc/shadowsocks-libev/config.json
      
     
      - name: 1. 在背景非同步啟動 Upterm (不卡住流程)
        if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
        # 用 owenthereal 替代，並透過 nohup 或 tmux 讓它在背景悄悄啟動
        run: |
          echo "正在啟動 Upterm 背景服務..."
          sudo apt-get update && sudo apt-get install -y upterm tmux
          
          # 將憑證設定限制為僅限觸發者本人使用
          mkdir -p ~/.ssh
          curl -s https://github.com{{ github.actor }}.keys >> ~/.ssh/authorized_keys
          
          # 在背景建立 tmux 暫存並啟動 upterm 伺服器
          tmux new-session -d -s upterm-debug 'upterm session host --log-output ~/.upterm.log'
        
      - name: 2. 擷取連線資訊並立刻發送到 Telegram
        if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
        run: |
          # 緩衝幾秒鐘，等待背景的 Upterm 完成握手與網域配置
          sleep 8
          
          # 嘗試取得生成的 SSH 公網連線 URL
          SSH_CMD=$(upterm session current --format ssh-url 2>/dev/null || echo "")
          
          if [ -z "$SSH_CMD" ]; then
            # 備用方案：若 CLI 未能即時回應，從日誌抓取連線字串
            SSH_CMD=$(grep -oE "ssh://[^ ]+" ~/.upterm.log | head -n 1)
          fi
          
          # 如果還是沒拿到，就填入提示
          if [ -z "$SSH_CMD" ]; then
            SSH_CMD="無法在日誌中找到指令，請前往 GitHub Actions 頁面手動檢查日誌。"
          fi
          
          # 組裝發送給 Telegram 的訊息
          MSG="🚀 *GitHub Actions 偵錯連線已啟動* %0A%0A 📋 *連線指令：* %0A \`$SSH_CMD\`"
          
          # 呼叫 Telegram Bot API 傳送
          curl -s -X POST "https://telegram.org{{ env.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=MarkdownV2" \
            -d "text=$MSG"
        env:
          TELEGRAM_BOT_TOKEN: '5352319218:AAGkspTTlIjIRyfYlI7Egz4NciZ78bT3NF4'
          TELEGRAM_CHAT_ID: 1373335316

      - name: 3. 將工作流卡住，開始等待你 SSH 進來
        if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
        run: |
          echo "=== 系統已卡住，等待 SSH 登入偵錯 ==="
          echo "當你偵錯完畢想讓 Workflow 繼續往下跑時，請在連線進去的終端機執行："
          echo "touch continue"
          
          # 這裡會真正卡住 Runner，直到你斷開連線或建立 continue 檔案
          while [ ! -f continue ]; do
            sleep 10
          done
          echo "偵錯完成，繼續執行接下來的任務。"



      
      
      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          #echo pwd
          ##/home/runner/work/roster/roster/icsconverter.py google_cal_08311.csv
          /home/runner/work/roster/roster/csv2ical.py google_cal_08311.csv 8311.ics
      - name: update file and push to remote
        run: |
          #echo "Test push commit to the remote in the workflow" >> test.txt
          git config --global user.name "harrylwc1"
          git config --global user.email "harrylwc1@gmail.com"
          #git remote set-url --push origin https://harrylwc1@gmail.com:$GITHUB_TOKEN@github.com/harrylwc/roster
          git commit -m "Add changes" -a
          git push https://github.com/harrylwc1/roster    
 
          
      -  name: SSH connection for failure Debug
         if: ${{ failure() }}
         uses: lhotari/action-upterm@v1
         #uses: mxschmitt/action-tmate@v3
         #uses: P3TERX/ssh2actions@main
