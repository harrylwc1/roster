name: CSV2ICS

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  TZ: Asia/Hong_Kong
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: System preparation
        id: prepare
        run: |
          # 清理 Docker（如有）
          docker system prune -f || true
          
          # 安装 Python 包
          pip3 install --upgrade pip
          pip3 install altgraph easygui icalendar macholib modulegraph py2app python-dateutil pytz six
          
          sudo timedatectl set-timezone "$TZ"

      - name: Convert CSV to iCal
        id: convert
        run: |
          python3 csv2ical.py google_cal_08311.csv 8311.ics
          echo "✅ Conversion completed"

      - name: Git commit changes
        id: commit
        run: |
          git config --global user.name "harrylwc1"
          git config --global user.email "harrylwc1@gmail.com"
          git add 8311.ics
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update calendar: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Git push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      # ✅ 使用 upterm 替代 tmate（你确认过能工作）
      - name: SSH connection for debug
        id: upterm
        if: failure() || github.event.inputs.ssh == 'true'
        uses: lhotari/action-upterm@v1
        with:
          detached: true
          # 可选：限制只有触发者可以连接
          # limit-access-to-actor: true

      # ✅ 发送 Telegram 通知（带 SSH 连接信息）
      - name: Send Telegram notification
        if: always() && steps.upterm.outcome == 'success'
        uses: proDreams/actions-telegram-notifier@main  # 更专门的 Telegram Action [citation:2]
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ job.status }}
          title: |
            ${{ steps.convert.outcome == 'success' && '✅ 转换成功 - SSH 调试可用' || '❌ 转换失败 - SSH 调试可用' }}
          message: |
            📅 CSV to iCal 通知
            -------------------------
            📦 仓库: ${{ github.repository }}
            🌿 分支: ${{ github.ref_name }}
            📊 转换状态: ${{ steps.convert.outcome }}
            🖥️ Runner: ${{ runner.name }}
            
            🔐 SSH 连接已开启（upterm）
            ⏰ 会话将在 30 分钟后自动关闭
            💡 请在 Actions 的 Checks 标签页查看连接命令
